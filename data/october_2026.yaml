narrative:
  dashboard_headline: Overall CSAT 94.1% (+8.1 pts)
  play_milestone: Maintaining a 4.0 Play Store rating for Thunderbird for Android is one of our annual goals. This is the first month we hit it.
  lede: |
    Overall CSAT 94.1% (+8.1 pts).
    - Donor CSAT 76.5% (−0.6 pts)
    - Thundermail CSAT 100% (+5.2 pts) on 51 ratings. Contact rate 6.2% among PostHog-visible users (320 of 5,164, −1.1 pts)
    - Push still leads Play Store friction (17 negative). Crashes 6, spam filter 5
  masthead_highlights:
  - Overall CSAT 94.1% (+8.1 pts).
  - Donor CSAT 76.5% (−0.6 pts).
  - Thundermail CSAT 100% (+5.2 pts) on 51 ratings.
  - Contact rate 6.2% among PostHog-visible users (320 of 5,164, −1.1 pts).
  asks: []
  donor_context: Donor CSAT 76.5% on 17 ratings (13 Good, 4 Bad; 37% response rate), down 0.6 pts from
    September’s 77.1% on 48 ratings. 4 Bad ratings pulled the score down. 3 are about Thunderbird
    technical support, 1 is about the donation appeal.
  overlap_notes:
    intro: Three Android · TfA channels, not one count — Play Store, Android SUMO, and K-9 Forum. Counts
      are not additive.
    rows:
    - signal: Push / notifications
      play_store: 29 mentions · 17 negative (Play Store #1; September 25 negative)
      sumo_android: 62 questions; too few to treat a push cluster as a trend
      k9_forum: Theme list is in the K-9 Forum section. Do not add it to the Play Store count.
      read: Same gap, louder on Play Store. The drop from 25 to 17 negative mentions is not a shipped
        notification fix.
    - signal: Crashes & freezes
      play_store: 10 mentions · 6 negative
      sumo_android: 62 questions; no crash count large enough to call a trend
      k9_forum: Theme list is in the K-9 Forum section. Do not add it to the Play Store count.
      read: Second by negative mentions on Play Store.
    - signal: Spam filter absent
      play_store: 16 mentions · 5 negative (September 7 negative)
      sumo_android: Too few questions to call a spam spike
      k9_forum: Theme list is in the K-9 Forum section. Do not add it to the Play Store count.
      read: Fewer negative mentions is not a junk filter shipped.
    footnote: Play Store October and September exports are both from GCS. Android SUMO is a small sample.
  android_context:
  - 'Play Console, Thunderbird only: default rating 3.840★. Last 28 days 4.077★ (rolling 28 days as of 1 Nov, not calendar October).'
  - 'Public Play listing 3.6★ on 9.62K reviews. Users 10,297. Those slower scores are why this month’s 4.07★ is the news.'
  github_alignment:
    headline: Feedback vs October GitHub work
    assessment: Play Store push/sync still leads negative mentions (17). Crashes (6) and spam filter (5) follow.
    bullets:
    - 'Push / Notification Sync: 17 negative (25 in September). A lower mention count is not a shipped notification fix.'
    - 'K-9 monthly average 3.58★ (from 3.63★).'
  roland_desktop:
  - 1,054 questions (September 1,002). Solved 57% (+6 pts). Ignored 20%. Trusted contributors 35%.
  - text: Attach button does nothing — 169 questions, new this month.
    children:
    - 'Fixed in [158.0.1](https://www.thunderbird.net/en-US/thunderbird/158.0.1/releasenotes/), [159.0](https://www.thunderbird.net/en-US/thunderbird/159.0/releasenotes/), and [ESR 153.5.0](https://www.thunderbird.net/en-US/thunderbird/153.5.0esr/releasenotes/). [Bugzilla 2077590](https://bugzilla.mozilla.org/show_bug.cgi?id=2077590).'
  - 'Gmail problems that cannot be diagnosed: 13 → 29.'
  - 'Cannot receive new mail, no error given: 53 → 22.'
  - 'AT&T POP certificate: 1 → 15. Fixed by AT&T.'
  - 'Account setup wizard failures: 39 → 28.'
  roland_android:
  - 62 questions (September 47). Solved 65%. Ignored 18%. Trusted contributors 52%.
  - The SUMO forum gets too few Thunderbird for Android questions to give much useful signal. The labeled set is 56 questions. Read the month as a list of problems, not a trend.
  sumo_desktop_signal: 1,054 desktop questions (September 1,002); synthetic solved rate 57% (September 51%). Attach button does nothing, 169 questions, fixed in 158.0.1, 159.0, and ESR 153.5.0.
  sumo_android_signal:
  - 62 questions (September 47). Solved 65%.
  - The SUMO forum gets too few Thunderbird for Android questions to give much useful signal. The labeled set is 56 questions.
  receive_resolve_resound: |
    **🕊 Receive**
    - 991 Zendesk tickets (−1.0% vs September 1,001) — Donor 417 (+21.2%), Thundermail 421 (−13.9%), Play Store review tickets 153 (September 168)
    - Thundermail: 320 unique requesters · 372 eligible tickets · 6.2% contact rate among PostHog-visible users (5,164 accounts.activity people)
    - Desktop forum 1,054 questions; Android forum 62
    - Play Store: push/sync still the loudest negative theme (17)
    **🪽 Resolve**
    - Overall CSAT 94.1% (+8.1 pts)
    - Thundermail CSAT 100% on 51 ratings (+5.2 pts)
    - Donor CSAT 76.5% (−0.6 pts)
    **✨ Resound**
    - Maintaining a 4.0 Play Store rating for Thunderbird for Android is one of our annual goals. This is the first month we hit it. Monthly average 4.07★, up from 3.76★. 250 of 444 reviews are 5★.
    - Engineering shipped in October: default push for the inbox (#11535) and for QR-code imports (#11666), a fix for a crash on screen rotation (#11721), and startup speed work (#11749).
    - Server Side Email Filtering moved to In flight (115 votes)
    - Donor CSAT, 17 ratings: 13 Good, 4 Bad. 4 Bad ratings pulled the score down. 3 are about Thunderbird technical support, 1 is about the donation appeal.
    - Thundermail CSAT, 51 ratings: all Good. 29 left no comment. 10 said the issue was resolved. 9 said the agent was kind. No single topic.
  goal_bullets: |
    - **Thunderbird for Android 4.07★:** Maintaining a 4.0 Play Store rating for Thunderbird for Android is one of our annual goals. This is the first month we hit it. Up from 3.76★. 250 of 444 reviews are 5★.
    - **Push / Notification Sync:** 17 negative. Later lever. A lower mention count is not a shipped notification fix.
    - **Crashes:** 6 negative. Later lever.
  experiments: ''
  whats_coming_up: ''

