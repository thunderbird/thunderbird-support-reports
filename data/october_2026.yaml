  methodology_scan:
  - Counts unique people, never raw events. One mailbox that sends 500 messages is
    still one person (uniq(person_id), not Total count).
  - "Overall contact-rate denominator: unique people on PostHog accounts.activity\
    \ \u2014 PostHog-visible users, not all subscribers, not Stalwart-only IMAP users\
    \ who never hit PostHog, and not the mail series."
  - 'Mail people: unique people who fired ham ingest, spam ingest, or outbound sent
    (thundermail.message-ingest.ham, thundermail.message-ingest.spam, thundermail.message-sending.sent).
    Same events as the PostHog insight; Unique users, not Total count.'
  - "Webmail people: unique people with accounts.login and clientId thunderbird-stormbox.\
    \ Sign-ins in the month are a floor \u2014 long-lived sessions miss a re-auth."
  - "Appointment people: apmt.* product events plus $pageview on appointment.tb.pro.\
    \ Public bookers reach that page with no Thundermail account, so Appointment people\
    \ include them \u2014 schedule-owner activity is account-side and far smaller\
    \ (product events and appointment-frontend logins). The Appointment contact rate\
    \ is directional because bookers sit in the denominator."
  - "Send people: product events plus $pageview on send.tb.pro. Almost all of them\
    \ show both send.tb.pro and send.*, so read Send as account-side use \u2014 not\
    \ the public-booker pattern."
  - 'Numerator: unique Zendesk requesters on the Thundermail brand after merge / test
    / agent-created / excluded-incident filters. Surface tickets from pro_service_*
    tags (Account Hub, Thundermail, Appointment, Send).'
  - "Webmail tickets: tagged Thundermail what: UI::Webmail (thundermail_what_ui__webmail)\
    \ or intelligent-triage webmail (thundermail_entity_area_webmail) \u2014 union,\
    \ counted once. They can also sit on Account Hub / Thundermail service tags."
  - "Internal users: monthly unique-people queries use PostHog's Filter out internal\
    \ and test users (person email does not contain @thunderbird.net; $host does not\
    \ match localhost / 127.0.0.1). That currently excludes 0 people \u2014 person\
    \ email is unset in this project and these events have no localhost $host \u2014\
    \ so counts still include staff. Zendesk requesters are not filtered the same\
    \ way."
  - Surfaces overlap and are never summed. Not an all-subscriber rate.
