# August was 4-day weeks and Lisa was out a lot). Lisa sent an 8/31 KPI note instead —
# those numbers ARE the July baseline. August MoM compares to July, not June.
# Zendesk (current) filled from Lisa 2026-09-09. Play Store CSVs fetched 2026-09-09 after gcloud reauth.

