  sumo_desktop_signal: "955 questions vs July 751; solved rate 58% (July 64%). Two headline clusters, and both of Roland's methods name the same pair. Printing broke in v154 — 36 tagged questions at 8.0× baseline, peaking 24.3× on Aug 20, resolved only 37% while unfixed; fixed in Thunderbird 155 (Sept 1). Spectrum/Charter/Roadrunner mail access failed for 34 users (3→34 MoM, 3.2× baseline, 31 of 34 at severity 4+) — provider-side, and Roland notes Spectrum recurs a few times a year. Yahoo +83%, Microsoft +47%; v153 POP spikes recurring. The solved-rate drop sits in four badly-served clusters: printing 37%, Yahoo/AT&T/AOL app-specific passwords 29%, repeated password prompts 42% (42% unanswered), blank message body 47%. Desktop only — no Play Store or Android app overlap."
  sumo_android_signal: "51 questions in the SUMO KPI export vs July 55; 61% solved (July 60%), ignored 27%. Roland's spike detector covers 40 questions and fired zero spikes — a volume artifact, not a clean month: it needs 8 questions of one kind in a month and August averaged ~1 question a day, and only 2% of questions record a Thunderbird version so the version×cause detector cannot fire at all. The AI read found 5 new clusters of two questions each; a change of one question is noise at this volume. Support-relevant: three credential/import clusters that look like one shared root cause, a new crash on opening downloaded mail, and contact autocomplete at 50% resolved — the only cluster support could not answer."
