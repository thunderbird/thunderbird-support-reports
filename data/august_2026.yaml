# Play Store GCS methodology still applies for any MoM that spans Jan–May (manual) vs June+ (GCS).
methodology_approved_by: mobile manager
methodology_notes:
  - "Play Store (June 2026+): review CSVs fetched from the Play Console GCS export bucket via scripts/fetch_reviews.py — replacing manual Play Console UI downloads used Jan–May 2026. Approved operational improvement. MoM comparisons spanning that boundary carry a methodology caveat."
  - "Full July dashboard skipped (onboardings, vacations, surgery; 4-day August weeks / Lisa out). Lisa sent an 8/31 KPI note instead — that is the July baseline. No July HTML by design."
  - "SUMO figures use Roland's concatenation method (the SUMO API was gated behind JS). SUMO MoM deltas are August vs July."
  - "Roland August validation re-fetch 2026-09-10: BOTH desktop and Android LLM_INSIGHTS monthly summaries now cover August 2026 vs July 2026 (pages regenerated 2026-09-10 07:38 / 07:54 UTC). The earlier 'LLM still June' caveat is resolved — August clusters below are genuinely August."
  - "Desktop question counts differ by corpus: SUMO KPI CSV 955 (dashboard/MoM basis), PROJECT1 spike detector 941, LLM_INSIGHTS 940. Same month, slightly different corpus filters — do not present as a discrepancy or reconcile by picking one. KPI cards use 955."
  - "Android question counts differ the same way: SUMO KPI CSV 51 (dashboard/MoM basis) vs 40 in both Roland August reports. Android is low-volume enough that this gap matters when quoting percentages — attribute each percentage to its own source."

