# September 2026 — Monthly Report Config
# Zendesk from Lisa 2026-10-06. Play Store CSVs in data/input/ (Aug+Sep, fetched 2026-10-06).
# quarterly_review = Lisa's 23 Sep outcomes as she reported (chat 5194e5e7, email list 29 Sep).
# Play Store 168 = 1–3★ tickets (see methodology_notes).
# Donor CSAT from Zendesk ratings export (1–30 Sep): 48 ratings, 37 Good / 11 Bad. 344 is ticket volume.

