narrative:
  dashboard_headline: Donor CSAT dropped to 77.1%; Thundermail volume and CSAT both rose
  lede: |
    Overall CSAT 86% (−4.9 pts).
    - Donor CSAT 77.1% (−15.6 pts)
    - Thundermail CSAT 94.8% (+9.1 pts). Contact rate 7.3% among PostHog-visible users (400 of 5,509, +2.4 pts)
    - Play Store review tickets (1–3 stars): 168
    - Desktop forum: 1,002 questions, 51% solved (−7 pts). Receive-mail failures (50), TB 155 blank filters (35, fixed in 155.0.1), Alice.it/TIM (21)
  masthead_highlights:
  - Overall CSAT 86% (−4.9 pts).
  - Donor CSAT 77.1% (−15.6 pts)
  - Thundermail CSAT 94.8% (+9.1 pts). Contact rate 7.3% among PostHog-visible users (400 of 5,509, +2.4 pts)
  - 'Play Store review tickets (1–3 stars): 168'
  - 'Desktop forum: 1,002 questions, 51% solved (−7 pts). Receive-mail failures (50), TB 155 blank filters (35, fixed in 155.0.1), Alice.it/TIM (21)'
  asks: []
  donor_context: Donor CSAT 77.1% on 48 ratings (37 Good, 11 Bad), down 15.6 pts from August’s 92.7%. The
    11 Bad ratings were spread across topics with no single driver, consistent with normal variation on a
    small sample.
  overlap_notes:
    intro: Three Android · TfA channels, not one count — Play Store, Android SUMO, and K-9 Forum. Counts
      are not additive.
    rows:
    - signal: Push / notifications
      play_store: '38 mentions · 25 negative (Play Store #1; August 34 negative)'
      sumo_android: 'Background sync/push unless the app is opened (3) and notification delays (2); no spike
        on the 41-question set'
      k9_forum: Notifications 7 topics (top K-9 Forum theme)
      read: Same gap, louder on Play Store. Channel counts are not additive. Mention-count drop 34→25 is not a shipped
        notification fix.
    - signal: Spam filter absent
      play_store: '12 mentions · 7 negative (Play Store #3; August 18 negative)'
      sumo_android: One junk-filter question — too few to count as a spike
      k9_forum: No headline spam/junk theme this month (32 topics, all categories)
      read: Play Store–only pain can persist when forum volume is too low to fire. Fewer mentions ≠ a junk
        filter shipped.
    footnote: Play Store September + August CSVs from GCS (fetched 2026-10-06). Android SUMO remains low-volume;
      LLM September clusters available 2026-10-08.
  github_alignment:
    headline: Feedback vs September GitHub work
    assessment: Desktop LLM flags receive-mail failures, TB 155 blank filters (fixed 155.0.1), and Alice.it/TIM;
      PROJECT1 still names residual printing on v154 (fixed in 155, 1 Sep). Android GitHub work vs Play Store
      friction is listed below; push/sync remains the loudest Play Store signal and leads Android
      SUMO LLM clusters.
    bullets:
    - 'Desktop: TB 155 blank-filter regression (35 qs, fixed 155.0.1) · Alice.it/TIM outage (21 LLM / 20
      PROJECT1) · printing residual on v154.'
    - 'Android: push/sync still leads Play Store negatives; Android SUMO LLM adds blank message bodies and
      QR import — PROJECT1 too small for spike detection.'
  roland_desktop:
  - 1,002 questions (August 955). Solved 51% (August 58%). Ignored 26%. Trusted contributors 32% of solves.
  - 'Receive-mail failures: 50'
  - 'TB 155 blank filters: 35, fixed in 155.0.1 on 9 Sep'
  - 'Alice.it/TIM: 21 (14% resolved; TIM fixed 24 Sep)'
  - 'Microsoft OAuth: 22 (18% resolved)'
  - 'AOL/Yahoo: 21'
  - 'Still spiking: Alice.it 20 questions (20×); printing on v154, 8 questions (20.3×, peak 1 Sep)'
  - 73% got a non-asker answer (median 3.8h)
  roland_android:
  - 47 questions (August 51). Solved 66% (August 61%). Ignored 26%. Trusted contributors 43%.
  - 41 questions, zero spikes. 85% answered (median 4.5h).
  - 'Background sync/push unless the app is opened: 3 (33% resolved)'
  - 'Empty message bodies: 3'
  - 'QR import broken at setup: 3'
  - Only 15% carry a Thunderbird version, so a version-by-cause read is missing data.
  sumo_desktop_signal: '1,002 desktop questions (August 955); synthetic solved rate 51% (August 58%). LLM
    names receive-mail failures (50), TB 155 blank filters (35, fixed 155.0.1), and Alice.it/TIM (21).'
  sumo_android_signal:
  - 47 questions (August 51)
  - 66% solved (+5 pts)
  - 'Push/sync: 3'
  - 'Blank bodies: 3'
  - 'QR import: 3'
  - No spikes in the 41-question set
  receive_resolve_resound: '**🕊 Receive**

    - 1,001 Zendesk tickets (+32.6% vs August 755) — Donor 344 (−2%), Thundermail 489 (+162%), App Store
    Reviews 168 (1–3★ review tickets; August 218 on the same basis)

    - Thundermail: 400 unique requesters · 447 eligible tickets · 7.3% contact rate among PostHog-visible
    users (5,509 accounts.activity people)

    - Desktop SUMO 1,002 questions; Android SUMO 47

    - Play Store: push/sync still the loudest Android review friction


    **🪽 Resolve**

    - Thundermail CSAT 94.8% (+9.1 pts vs August 85.7)

    - Android SUMO solved rate 66% (+5 pts)

    - Desktop solved rate 51% (−7 pts) — receive failures · TB 155 filters · Alice.it

    - Donor CSAT 77.1% (−15.6 pts)


    **✨ Resound**

    - Quarterly ideas review completed 23 Sep; updated FeatureOS statuses are in the Thundermail section

    - Thundermail CSAT recovered after August’s pricing DSAT month

    '
  goal_bullets: |
    - **Push / Notification Sync — still #1:** 25 negative (34→25) · 38 mentions · avg 2.58★ · 3-mo 31→34→25. Mention-count drop is not a shipped notification fix.
    - **QR / Settings Import — back in the top 3:** 8 negative (3→8) · 11 mentions · avg 2.18★ · 3-mo 25→3→8
    - **Rating gap:** TB 3.76★ needs +0.24★ to 4★ (K-9 3.63★, +0.03). Converting push 1–3★ reviewers is still the primary path.
  experiments: ''
  whats_coming_up: |
    **What's new: Thundermail plan + External ID on /contact tickets.** Logged-in users who file via /contact now send plan data and External ID into Zendesk, so we can triage, route, and report Thundermail customer vs non-customer tickets.

    - **Phase 2** is the same payload on every other intake path (email and unsigned forms), so we can segment customer vs non-customer everywhere.
    - **Donors:** the same approach is in progress.
    - **Constraints:** login is never required to file; email-direct stays.
