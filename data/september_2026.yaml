methodology_notes:
- 'Play Store (June 2026+): review CSVs fetched from the Play Console GCS export bucket via scripts/fetch_reviews.py
  — replacing manual Play Console UI downloads used Jan–May 2026. Approved operational improvement. MoM
  comparisons spanning that boundary carry a methodology caveat.'
- Zendesk volume 1,001 = Donor 344 + Thundermail 489 + App Store Reviews 168 (same three-brand sum as
  August). Play Store 168 is not inside donor or Thundermail.
- Play Store review tickets (168) count Zendesk tickets for 1–3★ reviews, not all star ratings. August’s
  218 is on the same basis.
- SUMO KPI from Roland CSV 2026-09-sumo-desktop/android-report.csv (concatenation method; desktop CSV
  regenerated 2026-10-12). Desktop PROJECT1 corpus is 977 questions vs KPI 1002; Android PROJECT1 41 vs
  KPI 47. Cluster reads cover 976 desktop questions and 41 Android questions; percentages stay with
  their own source.
- Cluster pages cover September vs August (refreshed 2026-10-08).
- 'Quarterly ideas review 23 Sep 2026: statuses reflect FeatureOS as of 2026-10-06.'
