roland_insights:
  android:
    month: 2026-09
    last_updated: '2026-10-12'
    questions: 47
    questions_mom: −4 vs August (51)
    methodology: KPI from Roland SUMO CSV = 47 questions. PROJECT1 and LLM_INSIGHTS both cover 41.
      Attribute percentages to their own source.
    source_url: https://thunderbird.github.io/thunderbird-metrics-and-reports/html_reports/android/2026-09-sumo-android-report.html
    project1:
      month: 2026-09
      last_updated: '2026-10-12'
      questions: 41
      spikes_total: 0
      answered_pct: 85
      answered_median_hours: 4.5
      cause_tagged_pct: 49
      source_url: https://thunderbird.github.io/thunderbird-metrics-and-reports/PROJECT1/REPORTS/android/exec-summary-latest.html
      low_volume_caveat: No spike cleared the threshold at any grain — volume artifact (~1 question/day).
        Detectors need 8/day, 6/week, or 8/month. Read a zero as 'nothing large enough to fire', not
        'nothing happened'.
      version_data_caveat: Only 15% of September Android questions carry a Thunderbird version, so the
        version×cause detector cannot fire. Its zero is missing data, not a clean result.
    llm:
      month: 2026-09
      last_updated: '2026-10-08'
      stale: false
      source_url: https://thunderbird.github.io/thunderbird-metrics-and-reports/LLM_INSIGHTS/REPORTS/android/monthly-summary-latest.html
      questions: 41
      questions_mom: 40 → 41 (+1, +2%)
      clusters: 29
      new_clusters: 6
      note: Read as a list of the month's problems, not a trend. 41 questions across 29 clusters means
        most clusters hold one or two questions. Severity and resolved carry the signal, not the counts.
      top_priorities:
      - rank: 1
        cluster: Background sync and push notifications not working unless app opened
        aug: 3
        severity: 3.7
        resolved_pct: 33
        new_this_month: true
      - rank: 2
        cluster: Message body renders empty in Android message viewer
        aug: 3
        severity: 3.3
        resolved_pct: 33
        new_this_month: true
        note: 67% unanswered
      - rank: 3
        cluster: QR code import button missing or non-functional at setup
        aug: 3
        severity: 3.3
        resolved_pct: 67
        new_this_month: true
      - rank: 4
        cluster: Push notification delays and re-enabling disabled notifications
        aug: 2
        severity: 3.0
        resolved_pct: 50
        new_this_month: true
      - rank: 5
        cluster: "Remote images: no 'always show' setting on Android"
        aug: 2
        severity: 2.0
        resolved_pct: 100
        new_this_month: true
      - rank: 6
        cluster: Cannot create folders or manage contacts in Thunderbird for Android
        aug: 2
        severity: 2.0
        resolved_pct: 100
        new_this_month: true
      themes:
      - Six new clusters this month; background sync/push and blank message bodies lead user pain (both
        33% resolved).
      - Category shifts: sync/OAuth 3→5, settings 3→6, migration/import 1→3, send/receive 5→7.
    cross_channel:
    - Android SUMO push/sync clusters echo Play Store Push / Notification Sync (25 negative) — same gap,
      different entry point; counts are not additive.
    - QR import friction appears on Android SUMO (3) and Play Store (8 negative) — setup path still loud.
  desktop:
    month: 2026-09
    last_updated: '2026-10-12'
    questions: 1002
    questions_mom: +47 vs August (955)
    methodology: KPI CSV 1002; PROJECT1 977; LLM_INSIGHTS 976. Each source is reported on its own basis.
    source_url: https://thunderbird.github.io/thunderbird-metrics-and-reports/html_reports/desktop/2026-09-sumo-desktop-report.html
    project1:
      month: 2026-09
      last_updated: '2026-10-12'
      questions: 977
      questions_mom: +34 (+4%) vs August 943 (PROJECT1 load; SUMO CSV is 1002)
      methodology: PROJECT1 — regex + traditional stats; version×cause spikes and release adoption. Non-AI
        engineering signal.
      source_url: https://thunderbird.github.io/thunderbird-metrics-and-reports/PROJECT1/REPORTS/desktop/exec-summary-latest.html
      spikes_total: 28
      answered_pct: 73
      answered_median_hours: 3.8
      cause_tagged_pct: 47
      headline: Alice.it and residual printing — Roland's own 'What stands out' pair
      what_stands_out:
      - signal: m:alice_it
        questions: 20
        note: 8 spikes; 20.0× baseline of 1.0; peaked 2026-09-23 with 9 questions
      - signal: feat:printing
        questions: 8
        note: 4 spikes; under monthly bar; peaked 2026-09-01 at 20.3× expected on Thunderbird 154 (users
          still on pre-155)
      - signal: m:virginmedia
        questions: 6
        note: 1 spike; week of 2026-09-07 at 19.3× expected on Thunderbird 155
      - signal: m:shaw
        questions: 5
        note: 1 spike; week of 2026-09-28 at 18.0× baseline
      - signal: m:microsoftemail
        questions: 67
        note: 2 spikes; under monthly bar; peaked 2026-09-16 at 9.0× baseline
    llm:
      month: 2026-09
      last_updated: '2026-10-08'
      stale: false
      questions: 976
      questions_mom: 940 → 976 (+36, +4%)
      clusters: 161
      new_clusters: 1
      methodology: Claude labels each question (problem, root-cause guess, severity 1–5), Python counts
        and ranks. Triage pointer, not proof. Agrees with PROJECT1 on Alice.it; adds TB 155 blank-filter
        regression and generic receive-mail pain that PROJECT1 cause tags alone understate.
      source_url: https://thunderbird.github.io/thunderbird-metrics-and-reports/LLM_INSIGHTS/REPORTS/desktop/monthly-summary-latest.html
      note: Mail delivery failures drove support up; three connection clusters (Alice.it, Microsoft OAuth,
        AOL/Yahoo) resolved below 50%. One new cluster — POP 'Unable to write the email to the mailbox'
        (7 qs).
      # "aug" key = current-month (September) count — generate.py Questions column still reads "aug"
      top_priorities:
      - rank: 1
        cluster: Generic 'cannot receive mail' / mail stopped arriving
        aug: 50
        severity: 4.1
        resolved_pct: 50
        unanswered_pct: 30
      - rank: 2
        cluster: TB 155 message filters with blank conditions match everything and misroute mail
        aug: 35
        severity: 4.3
        resolved_pct: 80
        known_status: Fixed in Thunderbird 155.0.1, released 2026-09-09 (Bugzilla 2068847, duplicate
          2068955). ESR 153 was never affected. Last report 2026-09-14.
      - rank: 3
        cluster: Alice.it/TIM POP/IMAP server connection refused (m:alice_it)
        aug: 21
        severity: 4.2
        resolved_pct: 14
        known_status: POP problem on TIM server in.alice.it (not IMAP). TIM fixed by 2026-09-24; pop.tim.it
          was the interim workaround.
      - rank: 4
        cluster: Microsoft/Outlook OAuth2 authentication failures (m:microsoftemail)
        aug: 22
        severity: 3.8
        resolved_pct: 18
        unanswered_pct: 55
      - rank: 5
        cluster: AOL/Yahoo account cannot send or receive
        aug: 21
        severity: 4.1
        resolved_pct: 33
        unanswered_pct: 43
      - rank: 6
        cluster: Generic SMTP send failure while receiving works
        aug: 28
        severity: 4.0
        resolved_pct: 61
  eng_alignment:
    source_month: 2026-09
    assessment: Desktop volume up (1002 KPI / 977 PROJECT1 / 976 LLM). LLM top signals are generic receive
      failures, TB 155 blank-filter regression (fixed 155.0.1), and Alice.it/TIM outage. PROJECT1 still
      flags residual printing on v154. Android still too low for PROJECT1 spike detection (41); LLM names
      push/sync and blank bodies. Play Store push/sync still leads negative mentions.
